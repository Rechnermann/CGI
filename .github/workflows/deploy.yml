name: Deploy Tasks 1-5 to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Challenge Tasks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Dry-Run Validation
        run: |
          kubectl apply --dry-run=client -f 1-deployment.yaml
          kubectl apply --dry-run=client -f 2-service.yaml
          kubectl apply --dry-run=client -f 3-hpa.yaml
          kubectl apply --dry-run=client -f 4-ingress.yaml
          kubectl apply --dry-run=client -f 5a-default-deny.yaml
          kubectl apply --dry-run=client -f 5b-allow-ingress.yaml
          kubectl apply --dry-run=client -f 5c-allow-dns.yaml

      - name: Deploy Tasks 1-5 to AKS
        run: |
          kubectl apply -f 1-deployment.yaml
          kubectl apply -f 2-service.yaml
          kubectl apply -f 3-hpa.yaml
          kubectl apply -f 4-ingress.yaml
          kubectl apply -f 5a-default-deny.yaml
          kubectl apply -f 5b-allow-ingress.yaml
          kubectl apply -f 5c-allow-dns.yaml

      - name: Verify Deployment Rollout
        run: |
          kubectl rollout status deployment/hello-world -n app-1 --timeout=60s
          kubectl get pods,svc,ingress,netpol -n app-1
