name: Deploy Tasks 1-5 to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch: # Erlaubt auch manuelles Ausführen im GitHub UI

jobs:
  deploy:
    name: Build & Deploy Challenge Tasks
    runs-on: ubuntu-latest

    steps:
      # 1. Code aus dem Repository auschecken
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Kubernetes-Manifeste auf Syntaxfehler prüfen (Linting)
      - name: Validate Manifests
        uses: statique/kubeval-action@v5.0.0
        with:
          files: 'k8s/' # Pfad zu deinen YAML-Dateien (anpassen falls nötig)

      # 3. Kubeconfig aus Secret laden und kubectl einrichten
      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      # 4. Tasks 1–5 automatisch im Cluster anwenden
      - name: Deploy to AKS
        run: |
          kubectl apply -f 01-namespace.yaml
          kubectl apply -f 02-deployment.yaml
          kubectl apply -f 03-service.yaml
          kubectl apply -f 04-ingress.yaml
          kubectl apply -f 05-networkpolicy.yaml

      # 5. Deployment-Status verifizieren
      - name: Verify Deployment Rollout
        run: |
          kubectl rollout status deployment/hello-world -n app-1 --timeout=60s
          kubectl get pods,svc,ingress,netpol -n app-1
